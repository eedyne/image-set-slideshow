name: Build Windows application

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install "Pillow>=11,<13" "pyinstaller>=6,<7"

      - name: Build single EXE
        run: >-
          python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --name ImageSetSlideshow
          image_set_player.py

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: ImageSetSlideshow-Windows
          path: dist/ImageSetSlideshow.exe
          if-no-files-found: error
